<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
scroll-behavior:smooth;
}

body{
background:#060c1b;
color:white;
}

/* NAV */

nav{
position:fixed;
top:0;
width:100%;
padding:22px;
background:#020510;
text-align:center;
box-shadow:0 5px 30px rgba(0,0,0,.6);
z-index:1000;
}

nav a{
color:#00ffe1;
text-decoration:none;
margin:0 18px;
font-weight:bold;
transition:.3s;
}

nav a:hover{
text-shadow:0 0 20px #00ffe1;
}

/* HERO */

.hero{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:140px 20px;

background:
radial-gradient(circle at center,#00ffe120,transparent 70%);
}

.hero h1{
font-size:70px;
margin-bottom:25px;
}

.hero p{
max-width:700px;
font-size:20px;
color:#ccc;
margin-bottom:40px;
}

/* BOTÃO */

.btn{
padding:18px 50px;
background:#00ffe1;
color:black;
font-weight:bold;
border-radius:18px;
text-decoration:none;
transition:.4s;
}

.btn:hover{
transform:scale(1.1);
}

/* CARDS */

.section{
padding:140px 40px;
text-align:center;
}

.cards{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:40px;
margin-top:70px;
}

.card{
width:260px;
padding:40px;
background:#0b1224;
border-radius:25px;
box-shadow:0 15px 50px rgba(0,0,0,.6);
transition:.4s;
}

.card:hover{
transform:translateY(-15px);
}

/* CONTATO */

.contact{
padding:120px 40px;
text-align:center;
}

.contact a{
display:inline-block;
margin:20px;
padding:18px 40px;
border-radius:15px;
text-decoration:none;
font-weight:bold;
}

.whats{
background:#00c853;
color:white;
}

.insta{
background:#ff0066;
color:white;
}

/* RESPONSIVO */

@media(max-width:768px){

.hero h1{
font-size:45px;
}

.cards{
flex-direction:column;
align-items:center;
}

.card{
width:90%;
}

}

footer{
text-align:center;
padding:60px;
background:black;
margin-top:150px;
}

</style>
