<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THURTECH | Portfólio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
scroll-behavior:smooth;
}

body{
background:#060c1b;
color:white;
}

/* CURSOR */

#cursor{
width:20px;
height:20px;
border:2px solid #00ffe1;
border-radius:50%;
position:fixed;
pointer-events:none;
transform:translate(-50%,-50%);
box-shadow:0 0 20px #00ffe1;
z-index:9999;
}

/* NAVBAR */

nav{
position:fixed;
top:0;
width:100%;
padding:22px;
text-align:center;
transition:.4s;
z-index:1000;
}

nav a{
color:#00ffe1;
text-decoration:none;
margin:0 18px;
font-weight:bold;
}

/* HERO */

.hero{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:140px 20px;

background:
radial-gradient(circle at center,#00ffe120,transparent 70%);
}

.hero h1{
font-size:70px;
margin-bottom:25px;
}

.hero p{
max-width:700px;
font-size:20px;
color:#ccc;
margin-bottom:40px;
}

/* BUTTON */

.btn{
padding:18px 50px;
background:linear-gradient(45deg,#00ffe1,#0088ff);
color:black;
font-weight:bold;
border-radius:18px;
text-decoration:none;
box-shadow:0 0 40px rgba(0,255,225,.6);
transition:.4s;
}

.btn:hover{
transform:scale(1.1);
}

/* SECTIONS */

.section{
padding:140px 40px;
text-align:center;
opacity:0;
transform:translateY(60px);
transition:1s;
}

.section.show{
opacity:1;
transform:translateY(0);
}

/* CARDS */

.cards{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:40px;
margin-top:70px;
}

.card{
width:260px;
padding:40px;
background:#0b1224;
border-radius:25px;
box-shadow:0 15px 50px rgba(0,0,0,.6);
transition:.4s;
}

.card:hover{
transform:translateY(-15px);
}

/* CONTATO */

.contact{
padding:120px 40px;
text-align:center;
}

.contact a{
display:inline-block;
margin:20px;
padding:18px 40px;
border-radius:15px;
text-decoration:none;
font-weight:bold;
}

.whats{
background:#00c853;
color:white;
}

.insta{
background:#ff0066;
color:white;
}

footer{
text-align:center;
padding:60px;
background:black;
margin-top:150px;
}

@media(max-width:768px){
.hero h1{
font-size:45px;
}
.cards{
flex-direction:column;
align-items:center;
}
.card{
width:90%;
}
}

</style>
</head>

<body>

<div id="cursor"></div>

<nav id="navbar">
<a href="#home">Home</a> |
<a href="#projetos">Projetos</a> |
<a href="#contato">Contato</a>
</nav>

<section id="home" class="hero section show">

<h1>THURTECH</h1>

<p>
Desenvolvimento web moderno e portfólio tecnológico profissional.
</p>

<a class="btn" href="#projetos">Ver Projetos</a>

</section>

<section id="projetos" class="section">

<h2>Projetos</h2>

<div class="cards">

<div class="card">
<h3>CliniCare</h3>
<p>Site clínico premium</p>
</div>

<div class="card">
<h3>FinanPro</h3>
<p>Financeiro empresarial</p>
</div>

<div class="card">
<h3>SmartPay</h3>
<p>Fintech moderna</p>
</div>

</div>

</section>

<section id="contato" class="contact section">

<h2>Contato</h2>

<a class="whats" href="https://wa.me/5584999999999">WhatsApp</a>
<a class="insta" href="https://instagram.com/">Instagram</a>

</section>

<footer>
THURTECH © 2026
</footer>

<script>

/* CURSOR */

let cursor = document.getElementById("cursor");

document.addEventListener("mousemove", e=>{
cursor.style.left = e.clientX+"px";
cursor.style.top = e.clientY+"px";
});

/* NAV SCROLL EFFECT */

window.addEventListener("scroll",()=>{

let nav = document.getElementById("navbar");

if(window.scrollY > 80){
nav.style.background="#020510";
nav.style.boxShadow="0 5px 40px rgba(0,0,0,.8)";
}else{
nav.style.background="transparent";
}

});

/* FADE SECTIONS */

const sections = document.querySelectorAll(".section");

window.addEventListener("scroll",()=>{

sections.forEach(sec=>{
let top = window.scrollY;
let offset = sec.offsetTop - 400;

if(top >= offset){
sec.classList.add("show");
}
});

});

</script>

</body>
</html>
